<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="100%" height="100%">
  <!-- 背景：陽光黃 -->
  <rect width="480" height="480" rx="32" fill="#FFBF36" />
  
  <!-- 幾何背景光環 -->
  <g opacity="0.15">
    <circle cx="240" cy="240" r="190" stroke="#242721" stroke-width="2" fill="none" stroke-dasharray="6 6" />
  </g>

  <!-- 地面瑜珈墊基線 -->
  <rect x="24" y="418" width="432" height="8" rx="4" fill="#DDA020" />

  <!-- 中央動向箭頭徽章 -->
  <g transform="translate(240, 248)">
    <circle cx="0" cy="0" r="22" fill="#242721" />
    <path d="M -8 0 L 8 0 M 3 -5 L 8 0 L 3 5" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <text x="0" y="36" font-family="'Noto Sans TC', sans-serif" font-size="11" font-weight="700" fill="#242721" text-anchor="middle">頸後伸直</text>
  </g>
  <!-- 左側：起始姿態 (屈肘於腦後) -->
  <g id="ovh-start" transform="translate(120, 0)">
    <rect x="-38" y="34" width="76" height="22" rx="11" fill="#242721" opacity="0.85" />
    <text x="0" y="49" font-family="'Barlow Condensed', sans-serif" font-size="11" font-weight="700" fill="#FFF4DD" text-anchor="middle" letter-spacing="1">1. 腦後預備</text>
    <!-- 跪姿下半身 -->
    <path d="M -20 280 L 20 280 L 25 350 L -25 350 Z" fill="#242721" />
    <rect x="-24" y="348" width="48" height="68" rx="8" fill="#FFE1AB" />
    <!-- 軀幹 -->
    <path d="M -18 190 L 18 190 L 16 282 L -16 282 Z" fill="#DD5605" />
    <!-- 頭部 -->
    <rect x="-12" y="146" width="24" height="26" rx="5" fill="#FFE1AB" />
    <path d="M -14 148 C -14 132, 14 132, 16 146 L 16 156 L -14 156 Z" fill="#242721" />
    <!-- 右臂高舉在上，小臂屈於後腦杓握啞鈴 -->
    <line x1="16" y1="190" x2="20" y2="120" stroke="#FFE1AB" stroke-width="10" stroke-linecap="round" />
    <line x1="20" y1="120" x2="-2" y2="150" stroke="#FFE1AB" stroke-width="9" stroke-linecap="round" />
    <circle cx="-2" cy="154" r="6" fill="#F5CCA0" />
    <g transform="translate(-2, 158)">
      <rect x="-10" y="-3" width="20" height="6" rx="2" fill="#777" />
      <rect x="-13" y="-10" width="5" height="20" rx="2" fill="#242721" />
      <rect x="8" y="-10" width="5" height="20" rx="2" fill="#242721" />
    </g>
  </g>

  <!-- 右側：完成姿態 (小臂向上伸直) -->
  <g id="ovh-end" transform="translate(360, 0)">
    <rect x="-38" y="34" width="76" height="22" rx="11" fill="#DD5605" />
    <text x="0" y="49" font-family="'Barlow Condensed', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">2. 垂直伸展</text>
    <path d="M -20 280 L 20 280 L 25 350 L -25 350 Z" fill="#242721" />
    <rect x="-24" y="348" width="48" height="68" rx="8" fill="#FFE1AB" />
    <path d="M -18 190 L 18 190 L 16 282 L -16 282 Z" fill="#DD5605" />
    <rect x="-12" y="146" width="24" height="26" rx="5" fill="#FFE1AB" />
    <path d="M -14 148 C -14 132, 14 132, 16 146 L 16 156 L -14 156 Z" fill="#242721" />
    <!-- 手臂筆直朝天伸直 -->
    <line x1="16" y1="190" x2="16" y2="90" stroke="#FFE1AB" stroke-width="10" stroke-linecap="round" />
    <ellipse cx="21" cy="140" rx="5" ry="10" fill="#F5CCA0" />
    <circle cx="16" cy="85" r="6" fill="#F5CCA0" />
    <g transform="translate(16, 80)">
      <rect x="-12" y="-3" width="24" height="6" rx="2" fill="#777" />
      <rect x="-15" y="-12" width="6" height="24" rx="2" fill="#242721" />
      <rect x="9" y="-12" width="6" height="24" rx="2" fill="#242721" />
    </g>
  </g>

</svg>