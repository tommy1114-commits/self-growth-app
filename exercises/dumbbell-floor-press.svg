<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="100%" height="100%">
  <!-- 背景：陽光黃 -->
  <rect width="480" height="480" rx="32" fill="#FFBF36" />
  
  <!-- 幾何背景光環 -->
  <g opacity="0.15">
    <circle cx="240" cy="240" r="190" stroke="#242721" stroke-width="2" fill="none" stroke-dasharray="6 6" />
  </g>

  <!-- 地面瑜珈墊基線 -->
  <rect x="24" y="418" width="432" height="8" rx="4" fill="#DDA020" />

  <!-- 中央動向箭頭徽章 -->
  <g transform="translate(240, 248)">
    <circle cx="0" cy="0" r="22" fill="#242721" />
    <path d="M -8 0 L 8 0 M 3 -5 L 8 0 L 3 5" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <text x="0" y="36" font-family="'Noto Sans TC', sans-serif" font-size="11" font-weight="700" fill="#242721" text-anchor="middle">推胸衝頂</text>
  </g>
  <!-- 左側：起始姿態 (肘觸地墊) -->
  <g id="press-start" transform="translate(110, 0)">
    <rect x="-38" y="34" width="76" height="22" rx="11" fill="#242721" opacity="0.85" />
    <text x="0" y="49" font-family="'Barlow Condensed', sans-serif" font-size="11" font-weight="700" fill="#FFF4DD" text-anchor="middle" letter-spacing="1">1. 肘觸地墊</text>
    <rect x="-60" y="380" width="120" height="18" rx="6" fill="#DD5605" />
    <circle cx="-75" cy="386" r="14" fill="#FFE1AB" />
    <path d="M -86 376 C -86 364, -68 364, -68 376 Z" fill="#242721" />
    <path d="M 50 380 L 80 340 L 92 414 Z" stroke="#FFE1AB" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- 手肘平靠於地面墊上，前臂垂直向上持啞鈴 -->
    <line x1="-30" y1="380" x2="-30" y2="410" stroke="#FFE1AB" stroke-width="10" stroke-linecap="round" />
    <line x1="-30" y1="410" x2="-5" y2="350" stroke="#FFE1AB" stroke-width="9" stroke-linecap="round" />
    <circle cx="-5" cy="346" r="6" fill="#F5CCA0" />
    <g transform="translate(-5, 342)">
      <rect x="-12" y="-3" width="24" height="6" rx="2" fill="#777" />
      <rect x="-15" y="-12" width="6" height="24" rx="2" fill="#242721" />
      <rect x="9" y="-12" width="6" height="24" rx="2" fill="#242721" />
    </g>
  </g>

  <!-- 右側：完成姿態 (向上推舉胸肌收縮) -->
  <g id="press-end" transform="translate(350, 0)">
    <rect x="-38" y="34" width="76" height="22" rx="11" fill="#DD5605" />
    <text x="0" y="49" font-family="'Barlow Condensed', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">2. 頂峰推舉</text>
    <rect x="-60" y="380" width="120" height="18" rx="6" fill="#DD5605" />
    <circle cx="-75" cy="386" r="14" fill="#FFE1AB" />
    <path d="M -86 376 C -86 364, -68 364, -68 376 Z" fill="#242721" />
    <path d="M 50 380 L 80 340 L 92 414 Z" stroke="#FFE1AB" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- 手臂筆直向上推起 -->
    <line x1="-30" y1="380" x2="-30" y2="280" stroke="#FFE1AB" stroke-width="10" stroke-linecap="round" />
    <circle cx="-30" cy="274" r="6" fill="#F5CCA0" />
    <g transform="translate(-30, 270)">
      <rect x="-12" y="-3" width="24" height="6" rx="2" fill="#777" />
      <rect x="-15" y="-12" width="6" height="24" rx="2" fill="#242721" />
      <rect x="9" y="-12" width="6" height="24" rx="2" fill="#242721" />
    </g>
  </g>

</svg>