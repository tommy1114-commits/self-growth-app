<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="100%" height="100%">
  <!-- 背景：陽光黃 -->
  <rect width="480" height="480" rx="32" fill="#FFBF36" />
  
  <!-- 幾何背景光環 -->
  <g opacity="0.15">
    <circle cx="240" cy="240" r="190" stroke="#242721" stroke-width="2" fill="none" stroke-dasharray="6 6" />
  </g>

  <!-- 地面瑜珈墊基線 -->
  <rect x="24" y="418" width="432" height="8" rx="4" fill="#DDA020" />

  <!-- 中央動向箭頭徽章 -->
  <g transform="translate(240, 248)">
    <circle cx="0" cy="0" r="22" fill="#242721" />
    <path d="M -8 0 L 8 0 M 3 -5 L 8 0 L 3 5" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <text x="0" y="36" font-family="'Noto Sans TC', sans-serif" font-size="11" font-weight="700" fill="#242721" text-anchor="middle">頂髖成橋</text>
  </g>
  <!-- 左側：起始姿態 (平躺屈膝) -->
  <g id="bridge-start" transform="translate(110, 0)">
    <rect x="-38" y="34" width="76" height="22" rx="11" fill="#242721" opacity="0.85" />
    <text x="0" y="49" font-family="'Barlow Condensed', sans-serif" font-size="11" font-weight="700" fill="#FFF4DD" text-anchor="middle" letter-spacing="1">1. 平躺屈膝</text>
    <rect x="-60" y="386" width="110" height="16" rx="6" fill="#DD5605" />
    <circle cx="-75" cy="390" r="14" fill="#FFE1AB" />
    <path d="M -86 380 C -86 368, -68 368, -68 380 Z" fill="#242721" />
    <!-- 屈膝踩地 -->
    <path d="M 40 388 L 65 330 L 80 414 Z" stroke="#FFE1AB" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- 雙手放於兩側地墊 -->
    <line x1="-30" y1="392" x2="20" y2="392" stroke="#FFE1AB" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- 右側：完成姿態 (以臀發力頂起髖部) -->
  <g id="bridge-end" transform="translate(350, 0)">
    <rect x="-38" y="34" width="76" height="22" rx="11" fill="#DD5605" />
    <text x="0" y="49" font-family="'Barlow Condensed', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">2. 頂峰夾臀</text>
    <circle cx="-75" cy="390" r="14" fill="#FFE1AB" />
    <path d="M -86 380 C -86 368, -68 368, -68 380 Z" fill="#242721" />
    <!-- 肩、髖、膝呈一條筆直斜線！ -->
    <path d="M -65 390 L 40 330" stroke="#DD5605" stroke-width="20" stroke-linecap="round" />
    <!-- 臀大肌收縮光環 -->
    <circle cx="20" cy="340" r="16" fill="#DD5605" opacity="0.3" />
    <path d="M 40 330 L 70 414" stroke="#FFE1AB" stroke-width="12" stroke-linecap="round" />
    <line x1="-50" y1="392" x2="0" y2="392" stroke="#FFE1AB" stroke-width="8" stroke-linecap="round" />
  </g>

</svg>