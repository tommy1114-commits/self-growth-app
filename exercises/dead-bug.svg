<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="100%" height="100%">
  <!-- 背景：陽光黃 -->
  <rect width="480" height="480" rx="32" fill="#FFBF36" />
  
  <!-- 幾何背景光環 -->
  <g opacity="0.15">
    <circle cx="240" cy="240" r="190" stroke="#242721" stroke-width="2" fill="none" stroke-dasharray="6 6" />
  </g>

  <!-- 地面瑜珈墊基線 -->
  <rect x="24" y="418" width="432" height="8" rx="4" fill="#DDA020" />

  <!-- 中央動向箭頭徽章 -->
  <g transform="translate(240, 248)">
    <circle cx="0" cy="0" r="22" fill="#242721" />
    <path d="M -8 0 L 8 0 M 3 -5 L 8 0 L 3 5" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <text x="0" y="36" font-family="'Noto Sans TC', sans-serif" font-size="11" font-weight="700" fill="#242721" text-anchor="middle">對角延伸</text>
  </g>
  <!-- 左側：起始姿態 (仰臥抬臂屈膝90度) -->
  <g id="deadbug-start" transform="translate(110, 0)">
    <rect x="-38" y="34" width="76" height="22" rx="11" fill="#242721" opacity="0.85" />
    <text x="0" y="49" font-family="'Barlow Condensed', sans-serif" font-size="11" font-weight="700" fill="#FFF4DD" text-anchor="middle" letter-spacing="1">1. 仰臥桌式</text>
    <rect x="-60" y="380" width="120" height="18" rx="6" fill="#DD5605" />
    <circle cx="-75" cy="386" r="14" fill="#FFE1AB" />
    <path d="M -86 376 C -86 364, -68 364, -68 376 Z" fill="#242721" />
    <!-- 雙臂向上直指天花板 -->
    <line x1="-30" y1="380" x2="-30" y2="300" stroke="#FFE1AB" stroke-width="8" stroke-linecap="round" />
    <!-- 雙腿抬起呈90度桌式 -->
    <path d="M 40 380 L 40 310 L 80 310" stroke="#FFE1AB" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- 右側：完成姿態 (對角線一手一腿平伸延展) -->
  <g id="deadbug-end" transform="translate(350, 0)">
    <rect x="-38" y="34" width="76" height="22" rx="11" fill="#DD5605" />
    <text x="0" y="49" font-family="'Barlow Condensed', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">2. 對角延伸</text>
    <rect x="-60" y="380" width="120" height="18" rx="6" fill="#DD5605" />
    <circle cx="-75" cy="386" r="14" fill="#FFE1AB" />
    <path d="M -86 376 C -86 364, -68 364, -68 376 Z" fill="#242721" />
    <!-- 右臂向後伸展靠近地面 -->
    <line x1="-30" y1="380" x2="-95" y2="350" stroke="#FFE1AB" stroke-width="8" stroke-linecap="round" />
    <!-- 左腿向前平行伸展 -->
    <line x1="40" y1="380" x2="110" y2="355" stroke="#FFE1AB" stroke-width="10" stroke-linecap="round" />
    <!-- 另一側手臂與腿保持固定 -->
    <line x1="-20" y1="380" x2="-20" y2="300" stroke="#FFE1AB" stroke-width="8" stroke-linecap="round" opacity="0.6" />
    <path d="M 30 380 L 30 310 L 70 310" stroke="#FFE1AB" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6" />
  </g>

</svg>