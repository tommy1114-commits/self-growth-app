<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="100%" height="100%">
  <!-- 背景：陽光黃 -->
  <rect width="480" height="480" rx="32" fill="#FFBF36" />
  
  <!-- 幾何裝飾環 -->
  <g opacity="0.15">
    <circle cx="240" cy="240" r="190" stroke="#242721" stroke-width="2" fill="none" stroke-dasharray="6 6" />
  </g>

  <!-- 地面基線 -->
  <line x1="36" y1="424" x2="444" y2="424" stroke="#DDA020" stroke-width="3" stroke-linecap="round" />

  <!-- 中央動向箭頭徽章 -->
  <g transform="translate(240, 248)">
    <circle cx="0" cy="0" r="22" fill="#242721" />
    <path d="M -8 0 L 8 0 M 3 -5 L 8 0 L 3 5" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <text x="0" y="36" font-family="'Noto Sans TC', sans-serif" font-size="11" font-weight="700" fill="#242721" text-anchor="middle">彎舉頂峰</text>
  </g>

  <!-- 左側：起始姿態 (STARTING POSE - 垂臂預備) -->
  <g id="starting-pose" transform="translate(120, 0)">
    <!-- 步驟標籤 -->
    <rect x="-38" y="34" width="76" height="22" rx="11" fill="#242721" opacity="0.85" />
    <text x="0" y="49" font-family="'Barlow Condensed', sans-serif" font-size="11" font-weight="700" fill="#FFF4DD" text-anchor="middle" letter-spacing="1">1. 垂臂預備</text>

    <!-- 頭部與五官 -->
    <path d="M -16 94 C -16 76, 16 76, 18 92 L 18 106 L -16 106 Z" fill="#242721" />
    <rect x="-14" y="92" width="28" height="32" rx="6" fill="#FFE1AB" />
    <circle cx="-15" cy="108" r="3.5" fill="#F5CCA0" />
    <circle cx="15" cy="108" r="3.5" fill="#F5CCA0" />
    <!-- 帥氣五官 -->
    <circle cx="4" cy="105" r="1.5" fill="#242721" />
    <path d="M 0 112 Q 4 114 8 112" stroke="#C48858" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <!-- 頸部 -->
    <rect x="-7" y="122" width="14" height="16" fill="#F5CCA0" />

    <!-- 軀幹：活力橘運動背心 -->
    <path d="M -22 136 L 22 136 L 18 224 L -18 224 Z" fill="#DD5605" />
    <path d="M -10 136 Q 0 148 10 136 Z" fill="#FFE1AB" />

    <!-- 雙臂自然下垂（手肘微貼身，掌心向前持啞鈴） -->
    <!-- 左臂 (畫面左側) -->
    <rect x="-32" y="140" width="10" height="52" rx="5" fill="#FFE1AB" />
    <rect x="-32" y="188" width="9" height="52" rx="4.5" fill="#FFE1AB" />
    <circle cx="-27" cy="244" r="6" fill="#F5CCA0" />
    <!-- 左手啞鈴 -->
    <g transform="translate(-27, 245)">
      <rect x="-12" y="-3" width="24" height="6" rx="2" fill="#777" />
      <rect x="-15" y="-14" width="6" height="28" rx="2" fill="#242721" />
      <rect x="9" y="-14" width="6" height="28" rx="2" fill="#242721" />
    </g>

    <!-- 右臂 (畫面右側) -->
    <rect x="22" y="140" width="10" height="52" rx="5" fill="#FFE1AB" />
    <rect x="23" y="188" width="9" height="52" rx="4.5" fill="#FFE1AB" />
    <circle cx="27" cy="244" r="6" fill="#F5CCA0" />
    <!-- 右手啞鈴 -->
    <g transform="translate(27, 245)">
      <rect x="-12" y="-3" width="24" height="6" rx="2" fill="#777" />
      <rect x="-15" y="-14" width="6" height="28" rx="2" fill="#242721" />
      <rect x="9" y="-14" width="6" height="28" rx="2" fill="#242721" />
    </g>

    <!-- 炭黑運動短褲 -->
    <path d="M -20 222 L 20 222 L 23 274 L 4 274 L 0 238 L -4 274 L -23 274 Z" fill="#242721" />

    <!-- 腿部 (雙腳與肩同寬微屈膝) -->
    <rect x="6" y="272" width="13" height="66" rx="6" fill="#FFE1AB" />
    <rect x="7" y="334" width="11" height="68" rx="5" fill="#FFE1AB" />
    <rect x="-19" y="272" width="13" height="66" rx="6" fill="#FFE1AB" />
    <rect x="-18" y="334" width="11" height="68" rx="5" fill="#FFE1AB" />

    <!-- 復古運動鞋 -->
    <path d="M 6 402 L 22 402 C 26 402, 28 410, 28 416 L 4 416 C 4 408, 5 402, 6 402 Z" fill="#242721" />
    <rect x="3" y="416" width="26" height="4" rx="2" fill="#FFFFFF" />
    <path d="M -22 402 L -6 402 C -5 402, -4 408, -4 416 L -28 416 C -28 410, -26 402, -22 402 Z" fill="#242721" />
    <rect x="-29" y="416" width="26" height="4" rx="2" fill="#FFFFFF" />
  </g>

  <!-- 右側：完成姿態 (ENDING POSE - 單臂彎舉頂峰收縮，完美對齊示意圖) -->
  <g id="ending-pose" transform="translate(360, 0)">
    <!-- 步驟標籤 -->
    <rect x="-38" y="34" width="76" height="22" rx="11" fill="#DD5605" />
    <text x="0" y="49" font-family="'Barlow Condensed', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">2. 頂峰收縮</text>

    <!-- 頭部 -->
    <path d="M -16 94 C -16 76, 16 76, 18 92 L 18 106 L -16 106 Z" fill="#242721" />
    <rect x="-14" y="92" width="28" height="32" rx="6" fill="#FFE1AB" />
    <circle cx="-15" cy="108" r="3.5" fill="#F5CCA0" />
    <circle cx="15" cy="108" r="3.5" fill="#F5CCA0" />
    <circle cx="4" cy="105" r="1.5" fill="#242721" />
    <path d="M 1 113 L 7 113" stroke="#242721" stroke-width="1.5" stroke-linecap="round" />
    <rect x="-7" y="122" width="14" height="16" fill="#F5CCA0" />

    <!-- 軀幹 -->
    <path d="M -22 136 L 22 136 L 18 224 L -18 224 Z" fill="#DD5605" />
    <path d="M -10 136 Q 0 148 10 136 Z" fill="#FFE1AB" />

    <!-- 左臂：保持自然下垂持啞鈴（形成對比） -->
    <rect x="-32" y="140" width="10" height="52" rx="5" fill="#FFE1AB" />
    <rect x="-32" y="188" width="9" height="52" rx="4.5" fill="#FFE1AB" />
    <circle cx="-27" cy="244" r="6" fill="#F5CCA0" />
    <g transform="translate(-27, 245)">
      <rect x="-12" y="-3" width="24" height="6" rx="2" fill="#777" />
      <rect x="-15" y="-14" width="6" height="28" rx="2" fill="#242721" />
      <rect x="9" y="-14" width="6" height="28" rx="2" fill="#242721" />
    </g>

    <!-- 右臂：肘部貼緊肋側，前臂向上彎舉頂峰收縮！ -->
    <!-- 上臂（保持垂直固定） -->
    <rect x="20" y="140" width="11" height="48" rx="5" fill="#FFE1AB" />
    <!-- 肱二頭肌隆起肌肉線條 -->
    <ellipse cx="23" cy="162" rx="6" ry="10" fill="#F5CCA0" />
    <path d="M 20 156 Q 26 162 20 170" stroke="#DD5605" stroke-width="2" fill="none" />

    <!-- 前臂向上彎曲（手肘為支點，前臂直指同側肩膀） -->
    <path d="M 20 186 L 24 140 L 34 142 L 31 188 Z" fill="#FFE1AB" />
    
    <!-- 右手手腕與啞鈴（位於右肩前側鎖骨高處） -->
    <circle cx="28" cy="138" r="6.5" fill="#F5CCA0" />
    <g transform="translate(28, 134)">
      <rect x="-12" y="-3" width="24" height="6" rx="2" fill="#777" />
      <rect x="-15" y="-14" width="6" height="28" rx="2" fill="#242721" />
      <rect x="9" y="-14" width="6" height="28" rx="2" fill="#242721" />
    </g>

    <!-- 炭黑運動短褲 -->
    <path d="M -20 222 L 20 222 L 23 274 L 4 274 L 0 238 L -4 274 L -23 274 Z" fill="#242721" />

    <!-- 腿部 -->
    <rect x="6" y="272" width="13" height="66" rx="6" fill="#FFE1AB" />
    <rect x="7" y="334" width="11" height="68" rx="5" fill="#FFE1AB" />
    <rect x="-19" y="272" width="13" height="66" rx="6" fill="#FFE1AB" />
    <rect x="-18" y="334" width="11" height="68" rx="5" fill="#FFE1AB" />

    <!-- 運動鞋 -->
    <path d="M 6 402 L 22 402 C 26 402, 28 410, 28 416 L 4 416 C 4 408, 5 402, 6 402 Z" fill="#242721" />
    <rect x="3" y="416" width="26" height="4" rx="2" fill="#FFFFFF" />
    <path d="M -22 402 L -6 402 C -5 402, -4 408, -4 416 L -28 416 C -28 410, -26 402, -22 402 Z" fill="#242721" />
    <rect x="-29" y="416" width="26" height="4" rx="2" fill="#FFFFFF" />
  </g>
</svg>
